name: Discloud watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: discloud-watchdog
  cancel-in-progress: false

jobs:
  wake-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DISCLOUD_APP_ID: '1776506693689'
      DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Discloud status and restart if offline
        run: node scripts/discloud-watchdog.js
